# ==========================================================================
# ZeroHunger Connect - application.properties
# Update the datasource block to match your local MySQL setup.
# ==========================================================================

spring.application.name=ZeroHunger Connect

# ---- MySQL Datasource ----
# 1. Create the database first:  CREATE DATABASE zerohunger_connect;
# 2. Update username/password below to match your MySQL install.
spring.datasource.url=jdbc:mysql://localhost:3306/zerohunger_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from the @Entity classes on startup.
# Switch to 'validate' once your schema is stable in a real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=8080

# ---- Default admin account (created automatically on first run) ----
zerohunger.admin.username=admin
zerohunger.admin.password=admin123
zerohunger.admin.email=admin@zerohunger.local
