<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in - ZeroHunger Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="stamp">Z</span> ZeroHunger Connect</div>
    <nav><a href="/register">Register</a></nav>
</div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="eyebrow">Sign in</div>
        <h2>Welcome back</h2>

        <div class="alert alert-error" th:if="${param.error}">Incorrect username or password.</div>
        <div class="alert alert-success" th:if="${param.registered}">Account created &mdash; sign in below.</div>
        <div class="alert alert-success" th:if="${param.logout}">You've been signed out.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.4rem;">Sign in</button>
        </form>

        <p class="muted" style="margin-top:1.2rem; text-align:center;">
            No account yet? <a href="/register">Register here</a>
        </p>
    </div>
</div>

</body>
</html>
