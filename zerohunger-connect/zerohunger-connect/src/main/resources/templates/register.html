<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - ZeroHunger Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="stamp">Z</span> ZeroHunger Connect</div>
    <nav><a href="/login">Sign in</a></nav>
</div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="eyebrow">Create account</div>
        <h2>Join ZeroHunger Connect</h2>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" id="regForm">

            <div class="role-tabs">
                <input type="radio" id="roleDonor" name="role" value="DONOR" checked onclick="showRole('DONOR')">
                <label for="roleDonor" id="labelDonor" class="active">Donor</label>

                <input type="radio" id="roleNgo" name="role" value="NGO" onclick="showRole('NGO')">
                <label for="roleNgo" id="labelNgo">NGO</label>

                <input type="radio" id="roleVolunteer" name="role" value="VOLUNTEER" onclick="showRole('VOLUNTEER')">
                <label for="roleVolunteer" id="labelVolunteer">Volunteer</label>
            </div>

            <div class="field-row">
                <div>
                    <label for="fullName">Full name / organization name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
            </div>

            <div class="field-row">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">

            <!-- Donor-specific fields -->
            <div id="fields-DONOR">
                <div class="field-row">
                    <div>
                        <label for="phoneD">Phone</label>
                        <input type="text" id="phoneD" name="phone">
                    </div>
                    <div>
                        <label for="businessType">Business type</label>
                        <input type="text" id="businessType" name="businessType" placeholder="Retail, Restaurant, Farm...">
                    </div>
                </div>
                <label for="addressD">Address</label>
                <input type="text" id="addressD" name="address">
            </div>

            <!-- NGO-specific fields -->
            <div id="fields-NGO" style="display:none;">
                <div class="field-row">
                    <div>
                        <label for="phoneN">Contact number</label>
                        <input type="text" id="phoneN" name="phone">
                    </div>
                    <div>
                        <label for="focusArea">Focus area</label>
                        <input type="text" id="focusArea" name="focusArea" placeholder="Community Kitchen, Food Bank...">
                    </div>
                </div>
                <label for="addressN">Address</label>
                <input type="text" id="addressN" name="address">
                <p class="muted">New NGO accounts require admin verification before accepting donations.</p>
            </div>

            <!-- Volunteer-specific fields -->
            <div id="fields-VOLUNTEER" style="display:none;">
                <div class="field-row">
                    <div>
                        <label for="phoneV">Phone</label>
                        <input type="text" id="phoneV" name="phone">
                    </div>
                    <div>
                        <label for="area">Service area</label>
                        <input type="text" id="area" name="area" placeholder="Neighborhood / zone">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.4rem;">Create account</button>
        </form>

        <p class="muted" style="margin-top:1.2rem; text-align:center;">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>

<script>
    function showRole(role) {
        ['DONOR', 'NGO', 'VOLUNTEER'].forEach(function(r) {
            document.getElementById('fields-' + r).style.display = (r === role) ? 'block' : 'none';
            document.getElementById('label' + r.charAt(0) + r.slice(1).toLowerCase()).classList.toggle('active', r === role);
        });
    }
</script>

</body>
</html>
